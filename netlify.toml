[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/passion"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/passion/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/Shanmugakumar-M-Resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
